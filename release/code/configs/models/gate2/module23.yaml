# Konfigurasi BEKU Gate 2 (MLE-H5-03). Dipakai scripts/run_gate2.py untuk O1-O3 (validasi)
# DAN refit HOLDOUT, sehingga konfigurasi holdout = konfigurasi validasi.
# Anggaran latih semua model neural disamakan: epochs=10, patience=10 (perbaikan ANOM-02;
# diajukan sebagai amandemen A4 di docs/protocol_amendments.md). Config basis
# configs/models/<model>.yaml tidak diubah agar run H2-H5 lama tetap reproducible.
model: module23
family: graph
base_config: configs/models/module23.yaml
hidden: 64
n_lags: 6
batch_size: 64
lr: 0.001
epochs: 10
patience: 10
grad_clip: 5.0
amp: true
entropy_lambda: 0.0
prior: bps
zero_climate: false
forecast_aligned: true
edge_lag_bias: true
no_gate: false
no_climate_gate: false
no_calendar: false
