            name:
              type: string
        period:
          type: string
          description: Period label, for example `Maret 2018`.
        region:
          type: object
          properties:
            regionCode:
              type: string
              description: Region code. Empty for the national level.
            regionLevel:
              type: string
              description: Region level, for example `Nasional`.
            regionName:
              type: string
              description: Region name. Empty for the national level.
        itemCategory1:
          $ref: '#/components/schemas/SdgsCategory'
        itemCategory2:
          $ref: '#/components/schemas/SdgsCategory'
        itemCategory3:
          $ref: '#/components/schemas/SdgsCategory'
        itemCategory4:
          $ref: '#/components/schemas/SdgsCategory'
        itemCategory5:
          $ref: '#/components/schemas/SdgsCategory'
        value:
          type: string
          description: The value, sent as a string.
        rse:
          type: string
          description: Relative standard error. Empty when not available.
