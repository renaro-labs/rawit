  /v1/api/list/model/data/domain/{domain}/var/{var}/th/{th}/key/{key}:
    get:
      tags:
      - Dynamic data
      operationId: getData
      summary: Get data
      description: 'Returns the numbers of one variable together with the labels needed to read them.


        Values live in `datacontent`. Each key is a code built from the ids of the vertical variable,
        the variable, the derived variable, the period and the derived period; use `vervar`, `var`, `turvar`,
        `tahun` and `turtahun` to translate the ids into labels.


        `th` and `turth` accept one id (`2`), a list (`2;3`) or a range (`2:6`).'
      parameters:
      - $ref: '#/components/parameters/Domain'
      - name: var
        in: path
        required: true
        description: Variable id, from **List variables**.
        schema:
          type: integer
        example: 145
      - name: th
        in: path
        required: true
        description: Period id(s) from **List periods** (`th_id`). One id (`100`), a list (`100;101`)
          or a range (`100:105`).
        schema:
          type: string
          pattern: ^[0-9]+([;:][0-9]+)*$
        example: '100'
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Lang'
      - name: turvar
        in: query
        required: false
        description: 'Derived variable id from **List derived variables**. Example: `289`.'
        schema:
          type: integer
      - name: vervar
        in: query
        required: false
        description: 'Vertical variable id from **List vertical variables**. Example: `9999`.'
        schema:
          type: integer
      - name: turth
        in: query
        required: false
        description: 'Derived period id(s) from **List derived periods** (`turth_id`): `1`, `2;3` or `2:6`.
          Example: `0`.'
        schema:
          type: string
          pattern: ^[0-9]+([;:][0-9]+)*$
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
              examples:
                sample:
                  summary: One variable, one region, one year
                  value:
                    status: OK
                    data-availability: available
                    var:
                    - val: 145
                      label: Persentase Rumah Tangga Menurut Provinsi dan Sumber Penerangaan
                      unit: Persen
                      subj: Lingkungan Hidup
                      def: ''
                      decimal: ''
                      note: '- Sumber: Susenas, BPS.'
                    turvar:
                    - val: 289
                      label: Listrik PLN
                    labelvervar: Provinsi
                    vervar:
                    - val: 9999
                      label: INDONESIA
                    tahun:
                    - val: 100
                      label: '2000'
                    turtahun:
                    - val: 0
                      label: Tahun
                    datacontent:
                      '99991452891000': 83.68
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
      x-codeSamples:
      - lang: r
        label: R
        source: 'key <- Sys.getenv("API_KEY")

          url <- paste0("https://YOUR_SERVER/v1/api/list/model/data/domain/0000/var/145/th/100/key/",
          key)

          res <- jsonlite::fromJSON(url)

          str(res$datacontent)'
