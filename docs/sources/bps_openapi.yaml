        for full HS codes, `keyword` to filter codes by words in their description, and `page` and `limit`
        to page through the results.
      parameters:
      - name: key
        in: path
        required: true
        description: API key supplied as the final path segment.
        schema:
          type: string
          minLength: 1
        example: YOUR_API_KEY
      - name: type
        in: query
        required: false
        description: 'HS-code level: `1` for two-digit codes or `2` for full HS codes.'
        schema:
          type: integer
          enum:
          - 1
          - 2
        example: 2
      - name: keyword
        in: query
        required: false
        description: Filter codes by words in their description. Matching is on the code text, for example
          `horse` returns the codes that mention horses.
        schema:
          type: string
        example: horse
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: integer
          minimum: 1
        example: 1
      - name: limit
        in: query
        required: false
        description: Maximum number of records requested per page.
        schema:
          type: integer
          minimum: 1
        example: 30
      responses:
        '200':
          description: Successful response. The list holds the HS codes on the requested page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignTradeHsCodeList'
              examples:
                twoDigit:
                  summary: Two-digit codes (`type=1`)
                  value:
                    status: OK
                    data-availability: available
                    data:
                    - page: 1
                      pages: 1
                      per_page: 30
                      count: 1
                      total: 1
                    - - id: '01'
                        text: '[01] Binatang hidup'
                        hs: hs2022
                  description: Sample returned a single code.
                full:
                  summary: Full HS codes filtered by `keyword=horse` (`type=2`), abridged
                  value:
                    status: OK
                    data-availability: available
                    data:
                    - page: 1
                      pages: 1
                      per_page: 30
                      count: 16
                      total: 16
                    - - id: 01012900
                        text: '[01012900] Live horses, other than pure-bred breeding animals'
                        hs: hs2022
                      - id: '02050000'
                        text: '[02050000] Meat of horses, asses, mules or hinnies, fresh, chilled or frozen'
                        hs: hs2022
                      - id: '73269070'
                        text: '[73269070] Horseshoes; riding boot spurs; of iron or steel'
                        hs: hs2022
                  description: 'Abridged: 3 of the 16 matching codes are shown.'
        default:
          $ref: '#/components/responses/Failure'
components:
  parameters:
    Key:
      name: key
      in: path
      required: true
      description: Your API key.
      schema:
        type: string
      example: YOUR_API_KEY
    Domain:
      name: domain
      in: path
      required: true
      description: 4-digit domain id from **List domains**. `0000` is the central level; `3100` is DKI
        Jakarta.
      schema:
        type: string
        pattern: ^[0-9]{4}$
      example: '0000'
    Lang:
      name: lang
      in: query
      required: false
      description: Response language. Defaults to `ind`.
      schema:
        type: string
        enum:
        - ind
        - eng
        default: ind
    LangPath:
      name: lang
      in: path
      required: true
      description: Response language.
      schema:
        type: string
        enum:
        - ind
        - eng
      example: eng
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: perpage
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
    Month:
      name: month
      in: query
      required: false
      description: Month number, 1 to 12.
      schema:
        type: integer
        minimum: 1
        maximum: 12
    Year:
      name: year
      in: query
      required: false
      description: 'Four-digit year. Example: `2023`.'
      schema:
        type: integer
    Keyword:
      name: keyword
      in: query
      required: false
      description: Search words. Use `+` between words.
      schema:
        type: string
    SdgsToken:
      name: Token
      in: header
      required: true
      description: API token supplied by the API client collection. Use a valid token; do not expose it
        in public examples.
      schema:
        type: string
        minLength: 1
      example: YOUR_API_KEY
  responses:
    NotFound:
      description: The domain, id or combination of parameters does not exist, so there is nothing to
        return. The body has `status` set to `Error` and `data-availability` set to `not-available`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            empty:
              summary: Nothing found
              value:
                status: Error
                data-availability: not-available
                data:
                - page: 1
                  pages: 0
                  per_page: 25
                  count: 0
                  total: 0
                - []
    Failure:
      description: Any other error. The body has `status` set to `Error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            empty:
              summary: Nothing found
              value:
                status: Error
                data-availability: not-available
                data:
                - page: 1
                  pages: 0
                  per_page: 25
                  count: 0
                  total: 0
                - []
  schemas:
    PageInfo:
      type: object
      description: Pagination details. Always the first item of `data` in list responses.
      properties:
        page:
          type: integer
          description: Current page.
        pages:
          type: integer
          description: Total pages.
        per_page:
          type: integer
          description: Items per page.
        count:
          type: integer
          description: Items on this page.
        total:
          type: integer
          description: Items across all pages.
    Envelope:
      type: object
      required:
      - status
      - data-availability
      properties:
        status:
          type: string
          enum:
          - OK
          - Error
          description: '`OK` on success, `Error` when the request failed.'
        data-availability:
          type: string
          examples:
          - available
          - not-available
          description: Whether data exists for the request, for example `available` or `not-available`.
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: array
            description: Page information followed by an empty list.
            minItems: 2
            maxItems: 2
            prefixItems:
            - $ref: '#/components/schemas/PageInfo'
            - type: array
              maxItems: 0
              items: {}
            items: {}
          message:
            type: string
            description: Explanation, when the server provides one.
    GenericResponse:
