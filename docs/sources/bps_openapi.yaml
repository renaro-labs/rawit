openapi: 3.1.0
info:
  title: BPS Statistical Data API
  version: 1.0.0
  summary: Read-only access to BPS statistical data, published content, and reference information.
  description: 'Provides read-only access to statistical data and published information from Badan Pusat
    Statistik (BPS). Use this API to discover data domains and subjects, retrieve dynamic and published
    tables, explore publications and news, access census and Yearbook Dataset data, query foreign-trade
    statistics, and consult statistical reference resources.


    ### Authentication

    Most BPS API endpoints require an API key in the `key` path parameter. Obtain a valid key through
    the official BPS API access process and keep it confidential. The SDGs Access endpoints use the authentication
    header defined by their operation. Authentication requirements may differ between API services; follow
    the requirements documented for each endpoint.


    ### Request conventions

    All operations in this specification use `GET` for read-only retrieval. Path parameters identify resources
    and are required where marked. Optional filters and pagination controls are supplied as query parameters
    where documented. Use the appropriate server URL for the service and environment.


    ### Response conventions

    Many list endpoints return a `data` array containing pagination metadata followed by result records.
    Detail endpoints may return a single object in `data`, while some services use different response
    structures. Each operation documents its expected response and representative payload.


    ### Usage guidance

    Begin with domain and subject discovery when retrieving BPS statistical data. Use the identifiers
    returned by list endpoints in subsequent requests. Keep API keys out of source control and public
    examples.

    ### Trying it out

    Open any endpoint, fill in the **key** field and press **Test Request**. Requests go to the server
    hosting this page.


    New here? Read the **Guides** first. '
servers:
- url: /
  description: This server
security: []
tags:
- name: Domains
  description: BPS websites at the national, provincial, regency, and city levels. Retrieve a domain identifier
    before requesting domain-specific statistical data.
- name: Subjects
  description: Subject categories and subjects used to organise statistical variables and tables within
    a domain.
- name: Dynamic data
  description: Discover variables, dimensions, periods, and units, then retrieve the corresponding statistical
    values.
- name: Static tables
  description: Find published statistical tables and retrieve table details, including available HTML
    content and download information.
- name: Tables by CSA subject
  description: Explore tables organised by Classification of Statistical Activities (CSA) subject.
- name: Press releases
  description: Retrieve official BPS press releases and their publication details.
- name: Publications
  description: Find BPS publications and access their available download links.
- name: Strategic indicators
  description: Retrieve headline statistical indicators and their latest reported values.
- name: Infographics
  description: Discover published BPS infographics and their available download links.
- name: News
  description: Browse BPS news items and news categories.
- name: Glossary
  description: Look up statistical terms and their definitions.
- name: Foreign trade
  description: Retrieve export and import statistics and supporting reference lists, including available
    years, ports, countries, and HS codes.
- name: SDGs and SDDS
  description: Retrieve the two BPS list endpoints for Sustainable Development Goals (SDGs) and the IMF
    Special Data Dissemination Standard (SDDS).
- name: Statistical classifications
  description: Browse statistical classifications, including KBLI and KBKI.
- name: Census
  description: Discover census events, topics, geographic areas, available datasets, and census data.
- name: Yearbook Dataset
  description: Access regional Yearbook Dataset tables using geographic area codes, subjects, and table
    identifiers.
- name: Search
  description: Search published content within a BPS domain.
- name: SDGs Access
  description: Access SDG goals, indicators, datasets, and dataset relationships through the SDGs data
    service.
x-tagGroups:
- name: Start Here
  tags:
  - Domains
  - Subjects
- name: Content
  tags:
  - Press releases
  - Publications
  - News
  - Infographics
  - Search
- name: Dataset
  tags:
  - Strategic indicators
  - Dynamic data
  - Static tables
  - Tables by CSA subject
  - Foreign trade
  - Census
  - Yearbook Dataset
  - SDGs Access
  - SDGs and SDDS
- name: Reference
  tags:
  - Glossary
  - Statistical classifications
paths:
  /v1/api/domain/type/{type}/key/{key}:
    get:
      tags:
      - Domains
      operationId: listDomains
      summary: List domains
      description: 'Returns the BPS websites (domains) of the level you ask for. The `domain_id` is required
        by almost every other endpoint, so start here. `0000` is the central level.


        To list the regencies and cities of one province, use `type` = `kabbyprov` and add the `prov`
        query parameter with the 4-digit province id.'
      parameters:
      - name: type
        in: path
        required: true
        description: Which level to list.
        schema:
          type: string
          enum:
          - all
          - prov
          - kab
          - kabbyprov
        example: prov
      - name: prov
        in: query
        required: false
        description: 'Province id (4 digits). Required when `type` is `kabbyprov`, ignored otherwise.
          Example: `1100`.'
        schema:
          type: string
          pattern: ^[0-9]{4}$
      - $ref: '#/components/parameters/Key'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainList'
              examples:
                sample:
                  summary: Central, Aceh and Sumatera Utara
                  value:
                    status: OK
                    data-availability: available
                    data:
                    - page: 1
                      pages: 1
                      total: 3
                    - - domain_id: '0000'
                        domain_name: Pusat
                        domain_url: https://www.bps.go.id
                      - domain_id: '1100'
                        domain_name: Aceh
                        domain_url: https://aceh.bps.go.id
                      - domain_id: '1200'
                        domain_name: Sumatera Utara
                        domain_url: https://sumut.bps.go.id
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
      x-codeSamples:
      - lang: r
        label: R
        source: 'key <- Sys.getenv("API_KEY")

          url <- paste0("https://YOUR_SERVER/v1/api/domain/type/prov/key/", key)

          domains <- jsonlite::fromJSON(url)

          # domains$data[[2]] holds the list of domains'
