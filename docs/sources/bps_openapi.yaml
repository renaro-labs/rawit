  /v1/api/list/model/var/domain/{domain}/key/{key}:
    get:
      tags:
      - Dynamic data
      operationId: listVariables
      summary: List variables
      description: Variables are the dynamic tables of a domain. Use the `var_id` with **Get data**. Narrow
        the list with `subject`, `year`, `area` or `vervar`.
      parameters:
      - $ref: '#/components/parameters/Domain'
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Lang'
      - name: subject
        in: query
        required: false
        description: 'Subject id, from **List subjects**. Example: `40`.'
        schema:
          type: integer
      - $ref: '#/components/parameters/Page'
      - name: year
        in: query
        required: false
        description: 'Only variables that have data for this year. Example: `2023`.'
        schema:
          type: integer
      - name: area
        in: query
        required: false
        description: 'Set to `1` to list only variables that exist in this domain. Example: `1`.'
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: vervar
        in: query
        required: false
        description: 'Only variables that use this vertical variable id. Example: `1`.'
        schema:
          type: integer
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableList'
              examples:
                sample:
                  summary: Sample response
                  value:
                    status: OK
                    data-availability: available
                    data:
                    - page: 1
                      pages: 10
                      per_page: 10
                      count: 10
                      total: 100
                    - - var_id: 145
                        title: Persentase Rumah Tangga Menurut Provinsi dan Sumber Penerangaan
                        sub_id: 29
                        sub_name: Lingkungan Hidup
                        def: ''
                        notes: ''
                        vertical: 1
                        unit: Persen
                        graph_id: 1
                        graph_name: Line
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
      x-codeSamples:
      - lang: r
        label: R
        source: 'key <- Sys.getenv("API_KEY")

          url <- paste0("https://YOUR_SERVER/v1/api/list/model/var/domain/0000/key/", key, "?lang=eng&page=1")

          vars <- jsonlite::fromJSON(url)'
