        number:
          type: string
          description: Target number, for example `1.2` or `2.a`.
        name:
          type: string
          description: Target statement.
        sdgsGoal:
          $ref: '#/components/schemas/SdgsGoal'
    SdgsIndicator:
      type: object
      description: An indicator that measures a target.
      properties:
        id:
          type: integer
          description: Indicator id.
        number:
          type: string
          description: Indicator number, for example `1.2.1*` or `3.3.3.[a]`. Formatting varies between
            indicators.
        name:
          type: string
          description: Indicator name. Can be an empty string for some indicators.
        sdgsTarget:
          $ref: '#/components/schemas/SdgsTarget'
    SdgsDatasetSummary:
      type: object
      description: Basic dataset details.
      properties:
        id:
          type: integer
          description: Dataset id.
        name:
          type: string
          description: Dataset name.
        owner:
          type: &id009
          - string
          - 'null'
          description: Dataset owner. `null` when not recorded.
        subject:
          type: *id009
          description: Dataset subject. `null` when not recorded.
        dateModified:
          type: string
          description: Last modification time, as `YYYY-MM-DD HH:MM:SS.S`.
    SdgsDataStructure:
      type: object
      description: One column of a dataset table.
      properties:
        role:
          type: string
          description: Column role, for example `Region` or `Dimension`.
        columnName:
          type: string
          description: Column name.
        headerType:
          type: string
          description: Where the column appears in the table, for example `Row` or `Column`.
        msVariableId:
          type:
          - integer
          - 'null'
          description: Linked variable id, if any.
        columnOrder:
          type: integer
          description: Position of the column, starting at 1.
    SdgsActivity:
      type: object
      description: Survey or activity metadata (`msKegiatan`) of the dataset. Only the main fields are
        listed; the object also carries the nested sections `penyelenggara`, `penanggungJawab`, `perencanaanPersiapan`,
        `desainKegiatan`, `pengumpulanData`, `pengolahanAnalisis` and `diseminasiHasil`.
      additionalProperties: true
      properties:
        id:
          type: integer
          description: Activity id.
        tahun:
          type: integer
          description: Activity year.
        judulKegiatan:
          type: string
          description: Activity title.
        jenisStatistik:
          type: string
          description: Statistics type, for example `STATISTIK_DASAR`.
        caraPengumpulanData:
          type: string
          description: Collection method, for example `KOMPILASI_PRODUK_ADMINISTRASI`.
        sektorKegiatan:
          type: string
          description: Sector, for example `PEMBANGUNAN`.
    SdgsDataset:
      allOf:
      - $ref: '#/components/schemas/SdgsDatasetSummary'
      - type: object
        description: Dataset with its indicators, table structure and activity metadata.
        properties:
          sdgsIndicators:
            type: array
            description: Indicators the dataset belongs to.
            items:
              type: object
              properties:
                sdgsIndicator:
                  $ref: '#/components/schemas/SdgsIndicator'
          msIndikatorId:
            type:
            - integer
            - 'null'
          msVariableId:
            type: array
            items:
              type: integer
          dataStructures:
            type: array
            items:
              $ref: '#/components/schemas/SdgsDataStructure'
          msKegiatan:
            $ref: '#/components/schemas/SdgsActivity'
    SdgsDatasetPage:
      type: object
      description: A page of datasets, in the Spring Data page format.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SdgsDataset'
        pageable:
          type: object
          properties:
            sort:
              type: object
              properties:
                sorted:
                  type: boolean
                unsorted:
                  type: boolean
                empty:
                  type: boolean
            offset:
              type: integer
            pageNumber:
              type: integer
              description: Zero-based page number.
            pageSize:
              type: integer
            paged:
              type: boolean
            unpaged:
              type: boolean
        totalElements:
          type: integer
          description: Datasets across all pages.
        totalPages:
          type: integer
        last:
          type: boolean
          description: '`true` on the last page.'
        number:
          type: integer
          description: Zero-based number of this page.
        sort:
          type: object
          properties:
            sorted:
              type: boolean
            unsorted:
              type: boolean
            empty:
              type: boolean
        size:
          type: integer
          description: Requested page size.
        first:
          type: boolean
          description: '`true` on the first page.'
        numberOfElements:
          type: integer
          description: Datasets on this page.
        empty:
          type: boolean
    SdgsCategory:
      type: object
      description: A dimension value and the name of the dimension it belongs to. Both are empty strings
