  /v1/api/dataexim/sumber/{sumber}/periode/{periode}/kodehs/{kodehs}/jenishs/{jenishs}/tahun/{tahun}/key/{key}:
    get:
      tags:
      - Foreign trade
      operationId: getForeignTrade
      summary: Get export or import data
      description: 'Export or import value and net weight by HS code, port and country.


        With `jenishs` = `1`, `kodehs` has two digits. With `jenishs` = `2`, `kodehs` is the full HS code
        following the BPS HS master for that year. Separate several codes with `;`.'
      parameters:
      - name: sumber
        in: path
        required: true
        description: 'Data source: `1` export, `2` import.'
        schema:
          type: integer
          enum:
          - 1
          - 2
        example: 1
      - name: periode
        in: path
        required: true
        description: 'Period type: `1` monthly, `2` annual.'
        schema:
          type: integer
          enum:
          - 1
          - 2
        example: 2
      - name: kodehs
        in: path
        required: true
        description: HS code(s), separated by `;`.
        schema:
          type: string
        example: 03;04
      - name: jenishs
        in: path
        required: true
        description: 'HS code type: `1` two digits, `2` full HS code.'
        schema:
          type: integer
          enum:
          - 1
          - 2
        example: 1
      - name: tahun
        in: path
        required: true
        description: Year of the data.
        schema:
          type: string
          pattern: ^[0-9]{4}$
        example: '2019'
      - $ref: '#/components/parameters/Key'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignTradeResponse'
              examples:
                sample:
                  summary: Sample response
                  value:
                    status: OK
                    data-availability: available
                    metadata:
                      source: 'Sumber : https://www.bps.go.id'
                      value: Nilai Ekspor/Impor dalam US Dollar ($)
                      netweight: Berat Ekspor/Impor dalam Kilogram (KG)
                      kodehs: Kode dan Deskripsi dari HS
                      pod: Pelabuhan Masuk/Keluar di Indonesia
                      ctr: Negara Asal/Tujuan
                      tahun: Tahun Data
                    data:
                    - value: 1015060.142
                      netweight: 243755
                      kodehs: '[03] Ikan dan krustasea, moluska serta invertebrata air lainnya'
                      pod: BELAWAN
                      ctr: ALBANIA
                      tahun: '2019'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
      x-codeSamples:
      - lang: r
        label: R
        source: 'key <- Sys.getenv("API_KEY")

          url <- paste0("https://YOUR_SERVER/v1/api/dataexim/sumber/1/periode/2/kodehs/03;04/jenishs/1/tahun/2019/key/",
          key)

          trade <- jsonlite::fromJSON(url)'
